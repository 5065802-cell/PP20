<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Security Cards</title>
  <style>
    body { font-family: Arial; background: #f4f6f8; padding: 20px; }
    .container { display: flex; gap: 15px; }
    .card { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    @media (max-width: 600px) {
      .container { flex-direction: column; }
    }
  </style>
</head>
<body>
  <h2>Security Tip Cards (Resize below 600px)</h2>
  <div class="container">
    <div class="card"><h3>Tip 1</h3><p>Use unique passwords for every account.</p></div>
    <div class="card"><h3>Tip 2</h3><p>Never share OTPs or PINs.</p></div>
    <div class="card"><h3>Tip 3</h3><p>Update apps and OS regularly.</p></div>
  </div>
</body>
</html>
